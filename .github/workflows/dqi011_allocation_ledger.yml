name: DQI source qubit allocation and lifetime ledger

on:
  pull_request:
    paths:
      - 'scripts/profile_dqi_source_allocations.py'
      - 'research/test_dqi011_lifetime.py'
      - 'scripts/join_dqi_square_source.py'
      - 'research/test_dqi012_square_source.py'
      - '.github/workflows/dqi011_allocation_ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-occurrence-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Syntax and tracked source allocator witness
        run: |
          python -m py_compile scripts/profile_dqi_source_allocations.py scripts/join_dqi_square_source.py
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python -m unittest discover \
            -s research -p "test_dqi011*.py" -v
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python -m unittest discover \
            -s research -p "test_dqi012*.py" -v
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python scripts/profile_dqi_source_allocations.py \
            --n 6 --m 15 --degree 6 \
            --report /tmp/dqi011_source_small.json
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python scripts/join_dqi_square_source.py \
            /tmp/dqi011_source_small.json --report /tmp/dqi012_square_small.json
      - name: Preserve full indexed qubit allocation records
        uses: actions/upload-artifact@v4
        with:
          name: dqi011_source_small
          path: |
            /tmp/dqi011_source_small.json
            /tmp/dqi012_square_small.json
