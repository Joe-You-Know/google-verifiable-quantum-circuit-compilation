name: DQI Experiment 023 full official-confidence validation

on:
  pull_request:
    paths:
      - 'research/dqi023_metadata_width.py'
      - 'scripts/verify_dqi023_official_confidence.py'
      - '.github/workflows/dqi023_official_confidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-full-competitor-confidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Exact supplied native DQI verifier 102400 shots
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/verify_dqi023_official_confidence.py \
            --mode all_narrow --shots 102400 --batch-size 256 \
            --log2-delta -128 --max-workers 1 \
            --out /tmp/dqi023_102400shot.json
      - name: Upload exact native full verifier packet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi023_102400shot_full_confidence
          path: /tmp/dqi023_102400shot.json
