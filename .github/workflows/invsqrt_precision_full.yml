name: Invsqrt precision full-domain candidate checks

on:
  pull_request:
    paths:
      - 'scripts/verify_precision_candidates.py'
      - '.github/workflows/invsqrt_precision_full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-domain-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Exhaustive reference-model checks and candidate builds
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers" python scripts/sweep_invsqrt_precision.py \
            --levels 1 2 --full --chunk 32768 \
            --output-dir /tmp/vqcc_precision_full \
            --report /tmp/vqcc_precision_full.json
      - name: Independent supplied Kickmix verifier (32-shot smoke)
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers" python scripts/verify_precision_candidates.py \
            /tmp/vqcc_precision_full.json \
            --output /tmp/vqcc_precision_smoke.json
      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: invsqrt_precision_full_evidence
          path: |
            /tmp/vqcc_precision_full.json
            /tmp/vqcc_precision_smoke.json
