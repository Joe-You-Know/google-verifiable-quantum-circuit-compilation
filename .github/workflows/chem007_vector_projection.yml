name: Chemistry source-vector angle projection

on:
  pull_request:
    paths:
      - 'scripts/chem007_vector_projection.py'
      - 'research/test_chem007_vector_projection.py'
      - '.github/workflows/chem007_vector_projection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vector-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Source-to-vector correctness tests
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python -m unittest discover \
            -s research -p 'test_chem007*.py' -v
      - name: Project original source vectors to 11-bit chart
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python scripts/chem007_vector_projection.py \
            --source sample_submission/dfthcsos/submission.npz \
            --target-bits 11 --passes 2 \
            --report /tmp/chem007_projection.json \
            --output-words /tmp/chem007_words11.npy
      - name: Preserve projection receipt
        uses: actions/upload-artifact@v4
        with:
          name: chem007_projection
          path: |
            /tmp/chem007_projection.json
            /tmp/chem007_words11.npy
