name: Invsqrt targeted phase and register audit

on:
  pull_request:
    paths:
      - 'scripts/verify_invsqrt_targets.py'
      - '.github/workflows/invsqrt_targeted_phase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Construct candidate from exhaustive numerical model
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers" python scripts/sweep_invsqrt_precision.py \
            --levels 1 --combination-order 5 \
            --only delta_bits_and_product_bits_and_result_bits_minus_1 \
            --full --output-dir /tmp/vqcc_best \
            --report /tmp/vqcc_best_precision.json
      - name: Targeted simulator check at worst and boundary inputs
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers" python scripts/verify_invsqrt_targets.py \
            /tmp/vqcc_best/delta_bits_and_product_bits_and_result_bits_minus_1.kmb \
            --focus-x 2684414 --focus-x 2588411 --focus-x 284670 \
            --span 2 --boundaries --shots 64 --seed 20261120 \
            --report /tmp/vqcc_best_targeted.json
      - name: Preserve numeric and targeted simulation evidence
        uses: actions/upload-artifact@v4
        with:
          name: invsqrt_targeted_phase
          path: |
            /tmp/vqcc_best_precision.json
            /tmp/vqcc_best_targeted.json
