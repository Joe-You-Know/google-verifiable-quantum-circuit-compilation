name: Chemistry ANGLE word quotient-remainder tests

on:
  pull_request:
    paths:
      - 'scripts/sweep_chem_angle_precision.py'
      - 'research/test_chem004_word_rescaling.py'
      - '.github/workflows/chem004_structural.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Python syntax and pure word-encoding law
        run: |
          python -m py_compile scripts/sweep_chem_angle_precision.py scripts/verify_chem_precision_candidates.py scripts/profile_dqi_baseline.py
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python -m unittest discover -s research -p 'test_chem004*.py' -v
      - name: Structural only width and 128-qubit cap audit
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python scripts/sweep_chem_angle_precision.py \
            --skip-numeric --widths 12 11 10 9 \
            --report /tmp/chem004_structural.json
      - name: Preserve structural ledger
        uses: actions/upload-artifact@v4
        with:
          name: chem004_structural
          path: /tmp/chem004_structural.json
