name: Causal frontier structural tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/causal_frontier_kmx.py scripts/convert_kickmix.py
      - name: Independent classical truth-table tests
        run: python -m unittest discover -s tests -v
