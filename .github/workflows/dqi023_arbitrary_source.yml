name: DQI Experiment 023c arbitrary syndrome control equivalence

on:
  pull_request:
    paths:
      - 'scripts/audit_dqi023_arbitrary_source.py'
      - '.github/workflows/dqi023_arbitrary_source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arbitrary-syndrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python dependencies
        run: python -m pip install numpy scipy
      - name: Small arbitrary 12-bit source basis comparison
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/audit_dqi023_arbitrary_source.py \
            --n 6 --m 15 --shots 256 \
            --out /tmp/dqi023_arbitrary_n6.json
      - name: Seventy syndrome arbitrary source basis comparison
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/audit_dqi023_arbitrary_source.py \
            --n 70 --m 70 --shots 64 \
            --out /tmp/dqi023_arbitrary_n70.json
      - name: Upload source counterexample records
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi023_arbitrary_syndrome_audit
          path: |
            /tmp/dqi023_arbitrary_n6.json
            /tmp/dqi023_arbitrary_n70.json
