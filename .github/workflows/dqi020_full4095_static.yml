name: DQI Experiment 020 full 4095-position static native compilation

on:
  pull_request:
    paths:
      - 'research/dqi020_experimental_decoder.py'
      - 'scripts/bench_dqi020_integrated_norm.py'
      - '.github/workflows/dqi020_full4095_static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-competition-width-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python dependencies
        run: python -m pip install numpy scipy
      - name: Compile baseline and candidate at 70 syndromes and 4095 positions
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD:$PWD/scripts" \
          python scripts/bench_dqi020_integrated_norm.py \
            --n 70 --m 4095 --degree 12 --compile-only --resource-only \
            --outdir /tmp/vqcc_dqi020_full4095
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi020_full4095_native_static_receipt
          path: /tmp/vqcc_dqi020_full4095/experiment_020.json
