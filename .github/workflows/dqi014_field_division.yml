name: DQI GF quotient scaffold source audit

on:
  pull_request:
    paths:
      - 'scripts/probe_dqi014_field_division.py'
      - 'scripts/verify_dqi014b_source_shear.py'
      - 'scripts/bench_dqi015_quotient_modes.py'
      - '.github/workflows/dqi014_field_division.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  field-division-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Probe untouched Kickmix GF division with inverse scaffolds
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python scripts/probe_dqi014_field_division.py | tee /tmp/dqi014_field_scaffold.jsonl
      - name: Test source-preserving polynomial quotient shear (original paper Thm 4.1)
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python scripts/verify_dqi014b_source_shear.py \
            --degree 4 12 --cases 500 --report /tmp/dqi014b_source_qr.json
      - name: Compare quotient gadget circuit alternatives
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python scripts/bench_dqi015_quotient_modes.py \
            --degree 4 12 --report /tmp/dqi015_quotient_modes.json
      - uses: actions/upload-artifact@v4
        with:
          name: dqi014_field_scaffold
          path: |
            /tmp/dqi014_field_scaffold.jsonl
            /tmp/dqi014b_source_qr.json
            /tmp/dqi015_quotient_modes.json
