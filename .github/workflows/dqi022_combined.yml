name: DQI Experiment 022c combined source consequences

on:
  pull_request:
    paths:
      - 'research/dqi022_serial_forney.py'
      - 'research/dqi022_sparse_control.py'
      - 'scripts/bench_dqi022_liveness_and_sparse.py'
      - '.github/workflows/dqi022_combined.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-full-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Small common-shot phase falsification
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi022_liveness_and_sparse.py \
            --n 6 --m 15 --degree 12 --shots 512 \
            --modes 020_reference sparse_serial_forney \
            --out /tmp/dqi022_combined_small.json
      - name: Full-width native 70x70 source resource comparison
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi022_liveness_and_sparse.py \
            --n 70 --m 70 --degree 12 --shots 0 \
            --modes 020_reference sparse_serial_forney \
            --out /tmp/dqi022_combined_70x70.json
      - name: Actual 70x4095 competition-width native compiler comparison
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi022_liveness_and_sparse.py \
            --n 70 --m 4095 --degree 12 --shots 0 \
            --modes 020_reference sparse_serial_forney \
            --out /tmp/dqi022_combined_70x4095.json
      - name: Upload independent source receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi022_combined_source_replay
          path: |
            /tmp/dqi022_combined_small.json
            /tmp/dqi022_combined_70x70.json
            /tmp/dqi022_combined_70x4095.json
