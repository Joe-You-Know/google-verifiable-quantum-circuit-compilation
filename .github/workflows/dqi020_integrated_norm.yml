name: DQI Experiment 020 synchronized EEA gated quotient

on:
  pull_request:
    paths:
      - 'research/dqi020_experimental_decoder.py'
      - 'scripts/bench_dqi020_integrated_norm.py'
      - '.github/workflows/dqi020_integrated_norm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-norm-small-dqi:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Compare original and feature-flagged EEA via native Kickmix
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD:$PWD/scripts" python scripts/bench_dqi020_integrated_norm.py \
            --n 6 --m 15 --degree 12 --shots 512 --batch-size 128 \
            --log2-delta -16 --outdir /tmp/vqcc_dqi020
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi020_integrated_norm_small
          path: /tmp/vqcc_dqi020/
