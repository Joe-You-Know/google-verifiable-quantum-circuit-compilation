name: DQI Experiment 022 full-width source-identity peak audit

on:
  pull_request:
    paths:
      - 'research/dqi022_sparse_control.py'
      - 'scripts/bench_dqi022_liveness_and_sparse.py'
      - '.github/workflows/dqi022_full_liveness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-liveness-n70:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python dependencies
        run: python -m pip install numpy scipy
      - name: Inspect native Forney phase API
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" python - <<'PY'
          import inspect
          import kickmix as km
          for name in ("gf2_phase_by_product", "cz", "ccz", "push_condition", "init_gf2_inverse_with_scaffold"):
              method = getattr(km.CircuitBuilder, name, None)
              print(name, "present", method is not None)
              if method is not None:
                  try: print("signature", inspect.signature(method))
                  except Exception as ex: print("signature unavailable", str(ex))
                  print("doc", str(getattr(method, "__doc__", None))[:4000])
          PY
      - name: Native n70 m70 compiler and exact source-occurrence replay
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi022_liveness_and_sparse.py \
            --n 70 --m 70 --degree 12 --shots 0 \
            --out /tmp/dqi022_full_liveness.json
      - name: Upload exact source-liveness ledger
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi022_n70_peak_liveness
          path: /tmp/dqi022_full_liveness.json
