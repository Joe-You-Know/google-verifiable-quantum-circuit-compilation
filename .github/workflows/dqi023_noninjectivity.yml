name: DQI Experiment 023d noninjective source forgetting

on:
  pull_request:
    paths:
      - 'scripts/audit_dqi023_recurrence_source_loss.py'
      - '.github/workflows/dqi023_noninjectivity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collision-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Exhaustive GF12 source-forgetting collision witness
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/audit_dqi023_recurrence_source_loss.py \
            --degree 12 --out /tmp/dqi023_noninjectivity.json
      - name: Upload exact source distinction receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi023_recurrence_noninjectivity
          path: /tmp/dqi023_noninjectivity.json
