name: DQI Forney source gadget cost audit

on:
  pull_request:
    paths:
      - 'scripts/profile_dqi_forney_gadgets.py'
      - '.github/workflows/dqi009_forney_gadgets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forney-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install numpy scipy
      - name: Measure source Forney components at three field widths
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD" python scripts/profile_dqi_forney_gadgets.py \
            --degrees 6 8 12 --report /tmp/dqi009.json
      - uses: actions/upload-artifact@v4
        with:
          name: dqi009_forney_gadget_costs
          path: /tmp/dqi009.json
