name: DQI Experiment 023e reversible source-carrier shears

on:
  pull_request:
    paths:
      - 'scripts/bench_dqi023_reversible_shear.py'
      - '.github/workflows/dqi023_reversible_shear.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-reversible-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Native full-field source-preserving forward and inverse
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi023_reversible_shear.py \
            --out /tmp/dqi023_reversible_shear.json
      - name: Upload native source identity receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi023_reversible_shear_native
          path: /tmp/dqi023_reversible_shear.json
