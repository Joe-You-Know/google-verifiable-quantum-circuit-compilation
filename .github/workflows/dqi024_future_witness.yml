name: Experiment 024b conditional quantum future witness recovery

on:
  pull_request:
    paths:
      - 'research/dqi024_quantum_carrier.py'
      - 'scripts/bench_dqi024_future_witness.py'
      - '.github/workflows/dqi024_future_witness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantum-witness-gf4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy scipy
      - name: Witnessed quantum quotient release GF4
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi024_future_witness.py \
            --degree 4 --cases 128 \
            --out /tmp/dqi024_witness_GF4.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi024_witness_GF4
          path: /tmp/dqi024_witness_GF4.json

  quantum-witness-gf12:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install numpy scipy
      - name: Witnessed quantum quotient release GF12
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi024_future_witness.py \
            --degree 12 --cases 128 \
            --out /tmp/dqi024_witness_GF12.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi024_witness_GF12
          path: /tmp/dqi024_witness_GF12.json
