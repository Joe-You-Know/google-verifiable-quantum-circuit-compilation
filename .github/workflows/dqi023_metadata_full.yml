name: DQI Experiment 023 benchmark-width metadata source audit

on:
  pull_request:
    paths:
      - 'research/dqi023_metadata_width.py'
      - 'scripts/bench_dqi023_metadata.py'
      - '.github/workflows/dqi023_metadata_full.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-n70-widths:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Native compile and source-gate at 70 syndromes / 70 code positions
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi023_metadata.py \
            --n 70 --m 70 --degree 12 --shots 0 \
            --modes baseline both_pairs all_narrow \
            --out /tmp/dqi023_70x70.json
      - name: Native compile actual competition-width 70/4095
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi023_metadata.py \
            --n 70 --m 4095 --degree 12 --shots 0 \
            --modes baseline both_pairs all_narrow \
            --out /tmp/dqi023_70x4095.json
      - name: Upload native size audit receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi023_native_fullwidth_widths
          path: |
            /tmp/dqi023_70x70.json
            /tmp/dqi023_70x4095.json

  native-fullwidth-phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Shared-shot full dimension phase sample
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers:$PWD/scripts:$PWD" \
          python scripts/bench_dqi023_metadata.py \
            --n 70 --m 4095 --degree 12 --shots 512 --confidence -16 \
            --modes both_pairs all_narrow \
            --out /tmp/dqi023_fullphase.json
      - name: Upload phase samples
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dqi023_fullwidth_512shot_phase
          path: /tmp/dqi023_fullphase.json
