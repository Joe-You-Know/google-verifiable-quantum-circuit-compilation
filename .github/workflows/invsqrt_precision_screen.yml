name: Invsqrt precision-width screen

on:
  pull_request:
    paths:
      - 'scripts/sweep_invsqrt_precision.py'
      - 'verifiers/invsqrt/nr_reference_circuit.py'
      - '.github/workflows/invsqrt_precision_screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependencies
        run: python -m pip install numpy scipy
      - name: Check supplied Kickmix ABI
        run: PYTHONPATH="$PWD/kickmix:$PWD/verifiers" python -c 'import sys,kickmix; print(sys.version); print(kickmix.__file__)'
      - name: Numeric screen (directed sample only)
        run: |
          PYTHONPATH="$PWD/kickmix:$PWD/verifiers" python scripts/sweep_invsqrt_precision.py \
            --levels 1 2 --no-circuits --report /tmp/precision_screen.json
      - name: Save screening receipt
        uses: actions/upload-artifact@v4
        with:
          name: invsqrt_precision_screen
          path: /tmp/precision_screen.json
